<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Forgot password · SentinelOps AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="{{ url_for('static', filename='css/login.css') }}" rel="stylesheet">
</head>
<body class="login-page">
<div class="stage">
  <section class="hero"><div class="hero-brand"><span class="mark">✦</span><span><b>SentinelOps</b><small>AI SECURITY OPERATIONS</small></span></div></section>
  <svg class="curve" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><path d="M80 0 C 71 22, 58 58, 53 100 L100 100 L100 0 Z"/></svg>
  <main class="card-wrap">
    <form class="card" method="post" novalidate>
      <h1>Forgot your password?</h1>
      <p class="lead">Enter your account email and we’ll send you a verification code.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}
      <div class="flash {{ category }}" role="alert">{{ message }}</div>{% endfor %}{% endwith %}
      <label for="email">Email<span>*</span></label>
      <input id="email" name="email" type="text" inputmode="email" placeholder="Enter your email" autocomplete="email" required autofocus>
      <button class="submit" type="submit">Send code</button>
      <a class="back" href="{{ url_for('auth_login') }}">← Back to sign in</a>
    </form>
  </main>
</div>
</body></html>
