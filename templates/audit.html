{% extends 'base.html' %}{% block content %}<h2 class="fw-bold">Audit Log</h2><div class="panel table-responsive"><table class="table"><thead><tr><th>Time</th><th>User</th><th>Action</th><th>Entity</th><th>ID</th><th>Details</th></tr></thead><tbody>{% for a in items %}<tr><td>{{ a.created_at }}</td><td>{{ a.username }}</td><td>{{ a.action }}</td><td>{{ a.entity_type }}</td><td>{{ a.entity_id }}</td><td>{{ a.details }}</td></tr>{% endfor %}</tbody></table></div>{% endblock %}
